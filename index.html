<!DOCTYPE Html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Badhan ferr fire hack</title>

</head>

<style>

*{box-sizing:border-box}
:root{
  --bg:#e8fbf4;
  --card:#f4fffb;
  --text:#123c3a;
  --muted:#527876;
  --border:#b9e8dc;
  --accent:#43c6b5;
  --accent2:#69c9f5;
  --hover:#d7f6ef;
}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,var(--bg),#e5f7ff);
  color:var(--text);
  min-height:100vh;
}
body.dark{
  --bg:#0b2425;
  --card:#123334;
  --text:#eaffff;
  --muted:#a5cecc;
  --border:#28615f;
  --accent:#45cdb9;
  --accent2:#61c9f4;
  --hover:#194847;
}
header{
  height:64px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 15px;
  background:linear-gradient(90deg,#d9f8ed,#dff4ff);
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:5;
}
body.dark header{background:linear-gradient(90deg,#123d3b,#123b4c)}
header h2{white-space:nowrap}
header button,#side button{
  border:0;
  background:transparent;
  color:inherit;
  padding:12px;
  font-size:18px;
}
#search{
  flex:1;
  max-width:650px;
  padding:11px 15px;
  border-radius:25px;
  border:1px solid var(--border);
  background:#f1fffb;
  color:var(--text);
  outline:0;
}
body.dark #search{background:#173f40}
#side{
  position:fixed;
  top:64px;
  bottom:0;
  width:230px;
  padding:15px;
  background:linear-gradient(180deg,#e0faf1,#e1f5ff);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  gap:5px;
}
body.dark #side{background:linear-gradient(180deg,#123b39,#123746)}
#side a{
  text-decoration:none;
  color:inherit;
  padding:13px 12px;
  border-radius:9px;
}
#side a:hover,#side button:hover{background:var(--hover)}
main{margin-left:230px;padding:22px}
.card1{
  background:var(--card);
  padding:20px;
  border-radius:14px;
  margin-bottom:20px;
  border:1px solid var(--border);
  box-shadow:0 5px 18px rgba(50,150,150,.08);
}

.card2{
  background:var(--card);
  padding:20px;
  border-radius:14px;
  margin-top: 10px;
  margin-bottom:16px;
  border:1px solid var(--border);
  box-shadow:0 5px 18px rgba(50,150,150,.08);
}

.card3{
  background:var(--card);
  padding:20px;
  border-radius:14px;
  margin-bottom:16px;
  border:1px solid var(--border);
  box-shadow:0 5px 18px rgba(50,150,150,.08);
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
}
.media video{
  width:100%;
  max-height:320px;
  background:#06191b;
  border-radius:9px;
}
.name{
  font-weight:bold;
  margin:10px 0;
  word-break:break-word;
}
.btn1{
  padding:10px 15px;
  border:0;
  border-radius:8px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:white;
  cursor:pointer;
}


.btn2{
  padding:10px 15px;
  border:0;
  border-radius:8px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:white;
  cursor:pointer;
}


.btn3{
  padding:10px 15px;
  border:0;
  border-radius:8px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:white;
  cursor:pointer;
}


input,select{
  width:100%;
  padding:11px 12px;
  margin:7px 0;
  border:1px solid var(--border);
  border-radius:9px;
  background:#f1fffb;
  color:var(--text);
}
body.dark input,body.dark select{background:#173f40}
.avatar{
  width:130px;
  height:130px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid var(--accent);
}
h1,h2,h3{color:var(--text)}
p{line-height:1.6}
@media(max-width:700px){
  header h2{display:none}
  #side{
    transform:translateX(-100%);
    transition:.2s;
    width:215px;
  }
  #side.open{transform:translateX(0)}
  main{margin-left:0;padding:15px}
}


.muted{
  text-align: center;
  background: linear-gradient(to left, #e57373, #651fff, #e91e63, #9c27b0);
  -webkit-text-fill-color: transparent;
  background-clip: text;
  
  font-size: 22px;
}


#hm-btn{
  text-align: center;
}

.BRtitle{
  text-align: center;
  background: linear-gradient(to right,  #9c27b0, lightblue, hotpink,  #651fff);
  -webkit-text-fill-color: transparent;
  background-clip: text;
  font-size: 45px;
}


.card1:hover{
  box-shadow: 10px 10px 20px black;
}


.card2:hover{
  box-shadow: 10px 10px 20px black;
}

.card3:hover{
  box-shadow: 10px 10px 20px black;
}
  
</style>

<body>

  <header>
    <button id="menu">☰</button>

    <b>BADHAN MOOD</b>

    <input
      id="search"
      placeholder="Search videos and files"
    >

    <button id="theme">🌙</button>
  </header>
  
  <h1 class="BRtitle">BADHAN HACK MOOD</h1>


  <aside id="side">

    <button data-p="home">
      ⌂ Home
    </button>

    <button data-p="videos">
      🎬 Videos
    </button>

    <button data-p="files">
      📁 Files
    </button>

    <button data-p="profile">
      👤 Profile
    </button>

    <button data-p="settings">
      ⚙ Settings
    </button>


    <a
      target="_blank"
      rel="noopener"
      href="https://www.instagram.com/badhan50012?stkn=YXozYWtxcGNiYXN2"
    >
      ◎ Instagram Account
    </a>


    <a
      target="_blank"
      rel="noopener"
      href="https://www.facebook.com/share/1C65RPeyiM/"
    >
      f Facebook Follow
    </a>


    <button data-p="admin">
      🔒 Admin Panel
    </button>

  </aside>


  <main id="app">
  </main>


  <script>
    
    const app = document.querySelector("#app"),
      side = document.querySelector("#side"),
      search = document.querySelector("#search"),
      theme = document.querySelector("#theme");

let items = JSON.parse(localStorage.getItem("badhanItems") || "[]");
let currentPage = "home";


if (localStorage.theme === "dark") {
  document.body.classList.add("dark");
  theme.textContent = "☀️";
}


document.querySelector("#menu").onclick = () =>
  side.classList.toggle("open");


theme.onclick = () => {
  document.body.classList.toggle("dark");

  let d = document.body.classList.contains("dark");

  localStorage.theme = d ? "dark" : "light";
  theme.textContent = d ? "☀️" : "🌙";
};


document.querySelectorAll("[data-p]").forEach(x =>
  x.onclick = () => page(x.dataset.p)
);


search.oninput = () =>
  renderMediaPage(currentPage, search.value);


function page(p) {
  side.classList.remove("open");

  currentPage = p;
  search.value = "";

  if (p === "home")
    home();

  else if (p === "videos" || p === "files")
    renderMediaPage(p);

  else if (p === "profile")
    profile();

  else if (p === "settings")
    settings();

  else if (p === "admin")
    admin();
}


function esc(x) {
  return String(x ?? "").replace(
    /[&<>"']/g,
    c => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    }[c])
  );
}


function card(x) {
  let c = document.createElement("div");

  c.className = "card media";

  if (x.type.startsWith("video/")) {
    c.innerHTML = `
      <video controls src="${x.data}"></video>
      <div class="name">${esc(x.name)}</div>
    `;
  } else {
    c.innerHTML = `
      <div style="font-size:50px">📄</div>
      <div class="name">${esc(x.name)}</div>
      <p class="muted">${bytes(x.size || 0)}</p>
    `;
  }

  let b = document.createElement("button");

  b.className = "btn";
  b.textContent = "Download";

  b.onclick = () =>
    downloadData(x.data, x.name);

  c.appendChild(b);

  return c;
}


function renderMediaPage(type, q = "") {
  let isVideo = type === "videos";
  let title = isVideo ? "Videos" : "Files";
  let icon = isVideo ? "🎬" : "📁";

  let a = items
    .filter(
      x =>
        isVideo
          ? x.type.startsWith("video/")
          : !x.type.startsWith("video/")
    )
    .filter(
      x =>
        x.name
          .toLowerCase()
          .includes(q.toLowerCase())
    );

  app.innerHTML = `
    <div class="card">
      <h1>${icon} ${title}</h1>
      <p class="muted">
        ${
          isVideo
            ? "All uploaded videos are shown here."
            : "All uploaded files are shown here."
        }
      </p>
    </div>

    <div id="grid" class="grid"></div>
  `;

  let g = document.querySelector("#grid");

  if (!a.length) {
    g.innerHTML = `
      <div class="card">
        No ${title.toLowerCase()} found.
      </div>
    `;

    return;
  }

  a.forEach(x =>
    g.appendChild(card(x))
  );
}


function home() {
  let videos = items.filter(
    x => x.type.startsWith("video/")
  ).length;

  let files = items.length - videos;

  app.innerHTML = `
    <div class="card1">
      <h1 id="hm-btn">🏠 Home</h1>
      <p class="muted">
        WELCOME TO BR HACKER SITE
      </p>
    </div>

    <div class="grid">

      <div class="card2">
        <h2>🎬 Videos</h2>
        <p>${videos} video(s)</p>
        <br>
        <button
          class="btn1"
          onclick="page('videos')"
        >
          Open Videos
        </button>
      </div>

      <div class="card3">
        <h2>📁 Files</h2>
        <p>${files} file(s)</p>
        <br>
        <button
          class="btn2"
          onclick="page('files')"
        >
          Open Files
        </button>
      </div>

    </div>
  `;
}


function profile() {
  let p = localStorage.profile || "";

  app.innerHTML = `
    <div class="card">
      <h1>👤 Profile</h1>

      ${
        p
          ? `<img class="avatar" src="${p}">`
          : `<div style="font-size:80px">👤</div>`
      }

      <h3>Profile picture</h3>

      <input
        id="pic"
        type="file"
        accept="image/*"
      >
    </div>
  `;

  document.querySelector("#pic").onchange = e => {
    let f = e.target.files[0];

    if (!f)
      return;

    let r = new FileReader();

    r.onload = () => {
      localStorage.profile = r.result;
      profile();
    };

    r.readAsDataURL(f);
  };
}


function settings() {
  app.innerHTML = `
    <div class="card">

      <h1>⚙ Settings</h1>

      <button
        id="m"
        class="btn"
      >
        🌙 Dark / ☀️ Light Mode
      </button>

      <h3>Language</h3>

      <select id="lang">
        <option value="en">English</option>
        <option value="bn">বাংলা</option>
        <option value="hi">हिन्दी</option>
      </select>

    </div>
  `;

  document.querySelector("#m").onclick = () =>
    theme.click();

  let l = document.querySelector("#lang");

  l.value = localStorage.lang || "en";

  l.onchange = () =>
    localStorage.lang = l.value;
}


function admin() {
  app.innerHTML = `
    <div class="card">

      <h1>🔒 Admin Panel</h1>

      <input
        id="pass"
        type="password"
        placeholder="Admin password"
      >

      <button
        id="unlock"
        class="btn3"
      >
        Unlock
      </button>

      <p id="msg"></p>

    </div>
  `;

  document.querySelector("#unlock").onclick = () =>
    document.querySelector("#pass").value === "BADHAN HACKER"
      ? dashboard()
      : document.querySelector("#msg").textContent =
          "Wrong password.";
}


function dashboard() {
  app.innerHTML = `
    <div class="card">

      <h1>🔒 Admin Panel</h1>

      <h2>Upload Video / File</h2>

      <select id="kind">
        <option value="video">Video</option>
        <option value="file">File</option>
      </select>

      <input
        id="file"
        type="file"
      >

      <button
        id="up"
        class="btn"
      >
        Upload
      </button>

      <p id="msg"></p>

    </div>

    <div class="card">

      <h2>Manage Uploads</h2>

      <div id="list"></div>

    </div>
  `;

  let list = document.querySelector("#list");

  if (!items.length)
    list.innerHTML =
      "<p class='muted'>No uploads yet.</p>";

  items.forEach((x, i) => {
    let d = document.createElement("div");

    d.className = "admin-row";

    d.innerHTML = `
      <span style="flex:1">
        ${
          x.type.startsWith("video/")
            ? "🎬"
            : "📁"
        }
        ${esc(x.name)}
      </span>

      <button class="btn red">
        Delete
      </button>
    `;

    d.querySelector("button").onclick = () => {
      items.splice(i, 1);
      save();
      dashboard();
    };

    list.appendChild(d);
  });


  document.querySelector("#up").onclick = () => {
    let f =
      document.querySelector("#file").files[0];

    let k =
      document.querySelector("#kind").value;

    let msg =
      document.querySelector("#msg");


    if (!f)
      return msg.textContent =
        "Select a file.";


    if (
      k === "video" &&
      !f.type.startsWith("video/")
    )
      return msg.textContent =
        "Please select a video.";


    if (
      k === "file" &&
      f.type.startsWith("video/")
    )
      return msg.textContent =
        "For videos, select Video.";


    let r = new FileReader();


    r.onload = () => {
      items.unshift({
        name: f.name,
        type: f.type,
        size: f.size,
        data: r.result
      });

      try {
        save();
        dashboard();
      } catch (e) {
        msg.textContent =
          "Browser storage is full. Try a smaller file/video.";
      }
    };


    r.readAsDataURL(f);
  };
}


function save() {
  localStorage.setItem(
    "badhanItems",
    JSON.stringify(items)
  );
}


function downloadData(data, name) {
  let a = document.createElement("a");

  a.href = data;
  a.download = name;

  document.body.appendChild(a);

  a.click();

  a.remove();
}


function bytes(n) {
  return n < 1024
    ? n + " B"
    : n < 1048576
      ? (n / 1024).toFixed(1) + " KB"
      : (n / 1048576).toFixed(1) + " MB";
}


page("home");
    
  </script>

</body>

</html>
